services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.33.0
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    ports: ["10000:10000", "10001:10001", "10002:10002"]
  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:1.1.2
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: mssql
      MSSQL_SA_PASSWORD: "local-only-Password123!"
    depends_on: [mssql]
    volumes:
      - ./servicebus-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    ports: ["${SERVICEBUS_HOST_PORT:-5672}:5672"]
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "local-only-Password123!"
    ports: ["1433:1433"]
