name: Validate Bicep Infrastructure

on:
  pull_request:
    paths:
      - 'infra/**/*.bicep'
      - 'infra/**/*.bicepparam'
      - 'infra/bicepconfig.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Build and lint Bicep
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Bicep
        run: az bicep install

      - name: Lint composition root
        run: az bicep lint --file infra/main.bicep

      - name: Build composition root
        run: az bicep build --file infra/main.bicep

      - name: Build environment parameter files
        shell: bash
        run: |
          set -euo pipefail
          for file in infra/environments/development.bicepparam infra/environments/test.bicepparam infra/environments/production.bicepparam; do
            az bicep build-params --file "$file"
          done

      - name: Reject identity identifiers in parameter overlays
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re

          files = [
              pathlib.Path("infra/environments/development.bicepparam"),
              pathlib.Path("infra/environments/test.bicepparam"),
              pathlib.Path("infra/environments/production.bicepparam"),
          ]
          identifier = re.compile(r"\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b", re.IGNORECASE)
          prohibited = ("ciamlogin.com", "externalIdentityAuthority", "externalIdentityValidIssuer", "externalIdentityTenantId", "externalIdentityAudience", "externalIdentityAllowedClientIds", "cursor")
          for path in files:
              contents = path.read_text(encoding="utf-8")
              if identifier.search(contents) or any(value.lower() in contents.lower() for value in prohibited):
                  raise SystemExit(f"Identity identifiers or cursor material must not be committed to {path}.")
          PY

      - name: Remove generated build output
        if: always()
        shell: bash
        run: |
          find infra -type f \( -name '*.json' -o -name '*.jsonc' \) -not -name 'bicepconfig.json' -delete
