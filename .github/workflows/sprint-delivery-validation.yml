name: Validate sprint delivery workflow

on:
  pull_request:
    paths:
      - 'delivery/**'
      - 'ops/**'
      - '.agents/skills/**'
      - 'AGENTS.md'
      - '.github/workflows/**'
      - '.github/pull_request_template.md'

permissions:
  contents: read

jobs:
  validate:
    name: Validate delivery contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install required Pester version
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 3.4.0 -Scope CurrentUser -Force

      - name: Run delivery workflow validation
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ops/Test-SprintDelivery.ps1
