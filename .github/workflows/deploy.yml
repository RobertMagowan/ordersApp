name: Deploy CloudOrders MVP

on:
  push:
    branches:
      - development
      - test
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-promotion-ref:
    name: Validate promotion ref
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.promotion-ref.outputs.environment }}
    steps:
      - name: Reject a non-promotion branch
        id: promotion-ref
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            development|test)
              echo "environment=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
              ;;
            master)
              echo "environment=production" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Manual deployments are allowed only from development, test, or master (got $GITHUB_REF_NAME)." >&2
              exit 1
              ;;
          esac

  deploy:
    name: Deploy ${{ github.ref_name }}
    needs: validate-promotion-ref
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.validate-promotion-ref.outputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_DEPLOYMENT_ENABLED: ${{ vars.AZURE_DEPLOYMENT_ENABLED }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_APP_NAME: ${{ vars.AZURE_APP_NAME }}
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      AZURE_MANAGED_ENVIRONMENT_NAME: ${{ vars.AZURE_MANAGED_ENVIRONMENT_NAME }}
      AZURE_LOG_ANALYTICS_NAME: ${{ vars.AZURE_LOG_ANALYTICS_NAME }}
      DEPLOYMENT_ENVIRONMENT: ${{ github.ref_name == 'master' && 'production' || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Publish deferred deployment summary
        if: env.AZURE_DEPLOYMENT_ENABLED != 'true'
        run: |
          {
            echo "## CloudOrders deployment"
            echo
            echo "- Release: \`$GITHUB_SHA\`"
            echo "- Immutable API image: not published (Azure deployment is disabled)"
            echo "- API endpoint: not deployed (Azure deployment is disabled)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Skip until Azure environment is provisioned
        if: env.AZURE_DEPLOYMENT_ENABLED != 'true'
        run: |
          echo "Azure deployment is disabled for this environment."
          echo "Set AZURE_DEPLOYMENT_ENABLED=true after configuring the Azure OIDC identity and resource group."

      - name: Validate deployment settings
        if: env.AZURE_DEPLOYMENT_ENABLED == 'true'
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          for value in AZURE_RESOURCE_GROUP AZURE_LOCATION AZURE_APP_NAME AZURE_ACR_NAME AZURE_MANAGED_ENVIRONMENT_NAME AZURE_LOG_ANALYTICS_NAME CLIENT_ID TENANT_ID SUBSCRIPTION_ID; do
            if [[ -z "${!value}" ]]; then
              echo "Missing required deployment setting: $value" >&2
              exit 1
            fi
          done

      - name: Sign in to Azure with OIDC
        if: env.AZURE_DEPLOYMENT_ENABLED == 'true'
        uses: azure/login@93381592711f247e165c389ebb30b596c84cdc48 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install and validate Bicep
        if: env.AZURE_DEPLOYMENT_ENABLED == 'true'
        run: |
          az bicep install
          az bicep lint --file infra/main.bicep
          az bicep build --file infra/main.bicep

      - name: Preview infrastructure changes
        if: env.AZURE_DEPLOYMENT_ENABLED == 'true'
        run: |
          PARAM_FILE="infra/environments/$DEPLOYMENT_ENVIRONMENT.bicepparam"
          az deployment group what-if \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters "$PARAM_FILE" \
              location="$AZURE_LOCATION" \
              environmentName="$DEPLOYMENT_ENVIRONMENT" \
              appName="$AZURE_APP_NAME" \
              acrName="$AZURE_ACR_NAME" \
              managedEnvironmentName="$AZURE_MANAGED_ENVIRONMENT_NAME" \
              logAnalyticsName="$AZURE_LOG_ANALYTICS_NAME" \
              targetPort=80 \
              enableLivenessProbe=false \
              useAcr=false \
              createAcrPullRole=false \
              containerImage='mcr.microsoft.com/k8se/quickstart:latest' \
            --mode Incremental \
            --result-format ResourceIdOnly

      - name: Provision MVP foundation with public bootstrap image
        if: env.AZURE_DEPLOYMENT_ENABLED == 'true'
        run: |
          az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters \
              "infra/environments/$DEPLOYMENT_ENVIRONMENT.bicepparam" \
              location="$AZURE_LOCATION" \
              environmentName="$DEPLOYMENT_ENVIRONMENT" \
              appName="$AZURE_APP_NAME" \
              acrName="$AZURE_ACR_NAME" \
              managedEnvironmentName="$AZURE_MANAGED_ENVIRONMENT_NAME" \
              logAnalyticsName="$AZURE_LOG_ANALYTICS_NAME" \
              targetPort=80 \
              enableLivenessProbe=false \
              useAcr=false \
              createAcrPullRole=false \
              containerImage='mcr.microsoft.com/k8se/quickstart:latest' \
            --mode Incremental

      - name: Build and publish immutable API image
        if: env.AZURE_DEPLOYMENT_ENABLED == 'true'
        id: image
        run: |
          LOGIN_SERVER=$(az acr show --name "$AZURE_ACR_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query loginServer --output tsv)
          az acr login --name "$AZURE_ACR_NAME"
          IMAGE_TAG="$LOGIN_SERVER/cloudorders-api:${GITHUB_SHA}"
          docker build --file src/CloudOrders.Api/Dockerfile --tag "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"
          DIGEST=$(az acr repository show --name "$AZURE_ACR_NAME" --image "cloudorders-api:${GITHUB_SHA}" --query digest --output tsv)
          if [[ -z "$DIGEST" ]]; then
            echo "Could not resolve the pushed image digest." >&2
            exit 1
          fi
          IMAGE="$LOGIN_SERVER/cloudorders-api@$DIGEST"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Grant managed identity ACR pull access
        if: env.AZURE_DEPLOYMENT_ENABLED == 'true'
        run: |
          PRINCIPAL_ID=$(az containerapp show \
            --name "$AZURE_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query identity.principalId --output tsv)
          REGISTRY_ID=$(az acr show \
            --name "$AZURE_ACR_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query id --output tsv)
          EXISTING=$(az role assignment list \
            --assignee-object-id "$PRINCIPAL_ID" \
            --scope "$REGISTRY_ID" \
            --query "[?roleDefinitionName=='AcrPull'].id | [0]" --output tsv)
          if [[ -z "$EXISTING" ]]; then
            az role assignment create \
              --assignee-object-id "$PRINCIPAL_ID" \
              --assignee-principal-type ServicePrincipal \
              --role AcrPull \
              --scope "$REGISTRY_ID"
          fi

      - name: Deploy immutable image after ACR access is ready
        if: env.AZURE_DEPLOYMENT_ENABLED == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters \
              "infra/environments/$DEPLOYMENT_ENVIRONMENT.bicepparam" \
              location="$AZURE_LOCATION" \
              environmentName="$DEPLOYMENT_ENVIRONMENT" \
              appName="$AZURE_APP_NAME" \
              acrName="$AZURE_ACR_NAME" \
              managedEnvironmentName="$AZURE_MANAGED_ENVIRONMENT_NAME" \
              logAnalyticsName="$AZURE_LOG_ANALYTICS_NAME" \
              targetPort=8080 \
              enableLivenessProbe=true \
              useAcr=true \
              createAcrPullRole=false \
              containerImage="$IMAGE" \
            --mode Incremental

      - name: Smoke test the deployed API
        if: env.AZURE_DEPLOYMENT_ENABLED == 'true'
        id: endpoint
        run: |
          FQDN=$(az containerapp show --name "$AZURE_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.configuration.ingress.fqdn --output tsv)
          ENDPOINT="https://$FQDN"
          HEALTHY=false
          echo "API endpoint: $ENDPOINT"
          for attempt in {1..30}; do
            STATUS=$(curl --fail --silent --show-error --output /dev/null --write-out '%{http_code}' "$ENDPOINT/health/live" || true)
            if [[ "$STATUS" == "200" ]]; then
              echo "Health check passed on attempt $attempt."
              echo "url=$ENDPOINT" >> "$GITHUB_OUTPUT"
              HEALTHY=true
              break
            fi
            echo "Health check returned HTTP $STATUS on attempt $attempt; waiting for revision activation."
            sleep 10
          done
          if [[ "$HEALTHY" != true ]]; then
            echo "Health check did not return HTTP 200." >&2
            exit 1
          fi

      - name: Publish deployment summary
        if: env.AZURE_DEPLOYMENT_ENABLED == 'true'
        env:
          ENDPOINT: ${{ steps.endpoint.outputs.url }}
          IMAGE: ${{ steps.image.outputs.image }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          {
            echo "## CloudOrders deployment"
            echo
            echo "- Release: \`$GITHUB_SHA\`"
            echo "- Immutable API image: \`$IMAGE\`"
            echo "- Published image tag: \`$IMAGE_TAG\`"
            echo "- API endpoint: $ENDPOINT"
          } >> "$GITHUB_STEP_SUMMARY"
